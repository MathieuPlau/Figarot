<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>/!\ FIGAROT /!\</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif;
        }
         h1, h2 {
            font-family: 'Roboto', sans-serif; 
            font-weight: 700;
        }
        .tab {
            cursor: pointer; 
            padding: 10px; 
            background-color: #f1f1f1; 
            margin-right: 5px; 
            display: inline-block; 
        }
        .tab.active { 
            background-color: #ddd; 
        }
        /* Parle, Figarot ! */
        #fixed-tab-content {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        /* Container to stack elements vertically */
        .input-container {
            display: flex;
            flex-direction: column;  /* Stack elements top-to-bottom */
            align-items: center;  /* Center everything */
            gap: 10px;  /* Add space between elements */
            width: 100%;
        }
        /* Input Group (Align Language Selection) */
        .input-group {
            display: flex;
        flex-direction: column;
        align-items: center;
        }
        /* Style the Select Dropdown */
        select {
            padding: 5px;
            font-size: 16px;
        }
        /* Style for the Text Area */
        textarea {
            width: 80%;
            max-width: 500px;
            height: 100px;
            font-size: 16px;
            padding: 5px;
            resize: vertical;
        }
        /* Style for the Speak Button */
        #speak-button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #speak-button:hover {
            background-color: #0056b3;
        }
        #file-list { 
            margin-top: 20px; 
        }
        .sound-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .sound-box {
            width: 150px;
            height: 100px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex; /* Flexbox for alignment */
            flex-direction: column; /* Stack elements vertically */
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
            text-align: center; /* Center the text itself */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 10px;
            overflow: hidden; /* Prevent overflowing content */
            text-decoration: none; /* Remove underline */
            color: inherit; /* Inherit text color */
            font-weight: bold;
            font-size: 16px;
            word-wrap: break-word; /* Break long words */
            overflow-wrap: break-word; /* Support for breaking long words */
            white-space: normal; /* Allow text to wrap */
        }
        .sound-box a {
            text-align: center; /* Center text inside the link */
            text-decoration: none; /* Remove underline */
            color: inherit; /* Use inherited text color */
            word-wrap: break-word; /* Enable word wrapping */
            overflow-wrap: break-word; /* Compatibility for breaking words */
            display: block; /* Ensure the text spans the box */
            white-space: normal; /* Allow wrapping */
        }
        .sound-box div {
            text-decoration: none; /* Remove underline */
            font-family: 'Roboto', sans-serif; /* Keep the previous font style */
        }
        .sound-box:hover {
            background-color: #eaeaea; /* Optional: Highlight on hover for better UX */
        }
        #controls {
            margin-top: 10px;
            margin-bottom: 10px;
        }       
        #stopButton {
            background-color: red; /* Red background */
            color: white; /* White text */
            font-weight: bold; /* Bold text */
            border: none; /* Remove borders */
            padding: 10px 20px; /* Add padding for a larger button */
            font-size: 16px; /* Increase font size */
            border-radius: 5px; /* Add rounded corners */
            cursor: pointer; /* Change cursor to pointer on hover */
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }
        #stopButton:hover {
            background-color: darkred; /* Darker red on hover */
        }
</style>

    </style>
</head>
<body>
    <h1>FIGAROT</h1>

    <!-- Controls -->
    <div id="controls">       
        <button id="stopButton" onclick="killAllSounds()">TA GUEULE !</button>
    </div>

    <!-- Tab Bar -->
    <div id="folder-tabs">
        <!-- Fixed Tab (Parle, Figarot !) -->
        <div class="tab active" id="fixed-tab" onclick="showFixedTab()">Parle, Figarot !</div>

        <!-- Dynamic Tabs for Folders -->
        {% for item in directory_contents %}
            {% if item.type == 'folder' %}
                <div class="tab" onclick="loadFolderContents('{{ item.name }}')">
                    {{ item.name }}
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <!-- Fixed Tab Content (Parle, Figarot !) -->
    <div id="fixed-tab-content">
        <h2>Parle, Figarot !</h2>
        
        <div class="input-container">
            <!-- Language Selection -->
            <div class="input-group">
                <label for="language">Choisis ta langue :</label>
                <select id="language">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                </select>
            </div>

            <!-- Text Input -->
            <textarea id="text-input" rows="4" cols="50" placeholder="Écris quelque chose de débile ici..."></textarea>

            <!-- Speak Button -->
            <button id="speak-button" onclick="speakText()">Parle</button>
        </div>
    </div>

    <!-- Display Files -->
    <div id="file-list">
        <h2>À toi de jouer 😁</h2>
    </div>
    <script>
        // Variable globale pour contrôler le son en cours de lecture
        let currentAudio = null;

        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            const visibleChars = Math.floor((maxLength - 3) / 2);
            return text.slice(0, visibleChars) + '...' + text.slice(-visibleChars);
        }     
        
        function playSound(folder, fileName) {
            // 1. On construit l'URL correcte pour Flask
            const audioUrl = `/audio/${folder}/${fileName}`;
            
            console.log("Tentative de lecture :", audioUrl);

            if (currentAudio) {
                currentAudio.pause();
            }

            currentAudio = new Audio(audioUrl);
            
            currentAudio.play().catch(error => {
                // 2. On affiche l'erreur réelle dans la console (F12) pour déboguer
                console.error('Erreur de lecture :', error);
                
                // 3. On n'affiche l'alerte que si c'est VRAIMENT un problème de blocage
                if (error.name === 'NotAllowedError') {
                    alert("Cliquez sur la page pour autoriser l'audio.");
                } else {
                    console.error("Le fichier est probablement introuvable ou le format est invalide.");
                }
            });
        }

        function killAllSounds() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            // On peut aussi prévenir le serveur par politesse
            fetch('/stop', {method: 'POST'});
        }
        
        function showFixedTab() {
            document.getElementById('fixed-tab-content').style.display = 'block';
            document.getElementById('file-list').style.display = 'none';
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById('fixed-tab').classList.add('active');
        }

        function loadFolderContents(folder) {
            document.getElementById('fixed-tab-content').style.display = 'none';
            document.getElementById('file-list').style.display = 'block';

            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            fetch(`/folder_contents?folder=${folder}`)
                .then(response => response.json())
                .then(data => {
                    const fileList = document.getElementById('file-list');
                    fileList.innerHTML = `<h2>Sons de ${folder}</h2>`;
                    const soundGrid = document.createElement('div');
                    soundGrid.classList.add('sound-grid');

                    data.forEach(item => {
                        if (item.type === 'file') {
                            const truncatedName = item.name.replace(/\.[^/.]+$/, "");

                            const soundBox = document.createElement('a');
                            soundBox.classList.add('sound-box');
                            soundBox.href = "#";
                            // On passe le dossier et le nom du fichier séparément
                            soundBox.onclick = (e) => {
                                e.preventDefault();
                                playSound(folder, item.name);
                            };
                            soundBox.innerHTML = `<div>${truncatedName}</div>`;
                            soundGrid.appendChild(soundBox);
                        }
                    });

                    fileList.appendChild(soundGrid);
                });
        }

        // Note pour SpeakText : Cette fonction nécessite que ton serveur 
        // renvoie le fichier généré pour être joué sur le client.
        function speakText() {
            let textInput = document.getElementById('text-input');
            let languageSelect = document.getElementById('language');
            let text = textInput.value.trim();
            let lang = languageSelect.value;

            if (!text) {
                alert("Veuillez entrer du texte !");
                return;
            }

            fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, lang: lang })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    textInput.value = "";
                    // Si ton backend '/speak' génère un fichier jouable, 
                    // il faudrait le récupérer ici pour le jouer avec playSound().
                    console.log("Texte envoyé au serveur");
                }
            });
        }
    </script>
</body>
</html>
